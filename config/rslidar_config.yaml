# rslidar_sdk configuration for a Lite3 fitted with a RoboSense LiDAR.

common:
  msg_source: 1                 # packets come from the LiDAR itself
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RS16
      msop_port: 6699
      difop_port: 7788
      imu_port: 0               # an RS16 has no IMU
      start_angle: 0
      end_angle: 360
      min_distance: 0.2
      max_distance: 200
      use_lidar_clock: false    # stamp with the host clock, as the robot does
      dense_points: false
      ts_first_point: true
    ros:
      ros_frame_id: rslidar
      ros_send_point_cloud_topic: /rslidar_points
      ros_queue_length: 100
